---
layout: default
---
<article class="wrap section post">
  <p class="eyebrow"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
  <h1>{{ page.title }}</h1>
  <div class="prose">
    {{ content }}
  </div>
  <p><a href="{{ '/writing/' | relative_url }}">← All writing</a></p>
</article>
