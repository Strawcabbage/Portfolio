- title: Grokking on Modular Arithmetic
  summary: >-
    Reproduced grokking, where a network generalizes long after memorizing its
    training set, with a transformer written from scratch in PyTorch.
  metric: { value: "~190×", label: "more steps to generalize than to memorize" }
  visual: grokking
  details:
    - Multi-head causal self-attention, pre-norm blocks and a 2-layer
      transformer built up from nn.Linear.
    - Trained on (a + b) mod 97 with 30% of all pairs, AdamW, weight decay
      0.1, for 100k steps.
    - Training accuracy passes 99% by step 200; validation accuracy stays near
      chance until it reaches 99% at step 38,200.
  tags: [PyTorch, Transformers, Deep Learning Theory]
  repo: https://github.com/Strawcabbage/grokking

- title: Transformer Engine
  status: In progress
  summary: >-
    An autograd and inference runtime written from scratch in C++17, working
    toward GPT-2 small inference.
  visual: autograd
  details:
    - Tensor library with reverse-mode autograd and hand-derived backward
      passes for matmul, softmax, layer norm and GELU, checked against
      finite-difference gradients under GoogleTest.
    - Now adding SIMD matmul kernels and a KV cache for GPT-2 small
      inference, validated against a PyTorch reference.
  tags: [C++17, SIMD, OpenMP, GoogleTest]
  repo: https://github.com/Strawcabbage/transformer_engine

- title: Ledgerly
  status: In progress
  summary: >-
    A LangGraph agent that will review a stock portfolio weekly and give each
    holding a buy / hold / trim / sell verdict.
  visual: ledgerly
  details:
    - Built so far are a Schwab brokerage MCP server with OAuth, news
      ingestion from Tavily, Finnhub and yfinance, and social-mention
      ingestion from StockTwits and Reddit, each fault-isolated and tested.
    - Next is the per-stock analysis subgraph, fanned out over holdings and
      aggregated into a weekly report, plus historical-replay evals.
  tags: [Python, LangGraph, MCP, LLM Agents]
  note: Private repository, code available on request

- title: BookReviews API
  summary: >-
    A Spring Boot backend with 23 REST endpoints for reviews, reading lists and
    a points-based reward system, deployed on AWS.
  metric: { value: "9.8 ms", label: "p50 latency · 30.5 ms p95 over 500 requests" }
  visual: bookreviews
  details:
    - Runs on AWS Elastic Beanstalk with PostgreSQL on RDS, with
      Flyway-managed schema migrations and OAuth2/OIDC + JWT security.
    - A review and the points it awards commit or roll back as one
      transaction, keeping balances consistent under concurrent requests.
  tags: [Java, Spring Boot, PostgreSQL, AWS, Docker]
  repo: https://github.com/Strawcabbage/BookReviews

- title: Unix Shell
  summary: >-
    An interactive Unix shell in C, built directly on fork, exec, pipe and
    dup2.
  metric: { value: "~850", label: "lines of C" }
  visual: terminal
  details:
    - Custom tokenizer and parser for multi-stage pipelines, I/O redirection
      and built-ins (cd, help, history, exit).
    - Background job control, with SIGINT and SIGCHLD handlers to manage and
      reap child processes.
  tags: [C, Linux, Systems Programming]
  repo: https://github.com/Strawcabbage/c_shell

- title: Major Quest
  summary: >-
    A college-to-career simulation game, built with Ariav Hayempour, driven by
