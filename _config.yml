# Site settings — edit these first.
title: Jackson Hull
tagline: CS & Physics @ UW–Madison · AI optimization · RL for robotics
description: >-
  Portfolio of Jackson Hull, a Computer Science and Physics undergraduate at the
  University of Wisconsin–Madison interested in AI optimization research and
  reinforcement learning for robotics.
author: Jackson Hull

# This repo is served as a GitHub Pages *project* site at
# https://strawcabbage.github.io/Portfolio/. If you rename the repo to
# strawcabbage.github.io (or add a custom domain), set baseurl to "".
url: "https://strawcabbage.github.io"
baseurl: "/Portfolio"

# Contact links. Leave a value empty ("") to hide it.
contact:
  email: Jackson@hulitech.com
  github: Strawcabbage
  linkedin: jackson-hull-132966278
  resume: /assets/resume.pdf

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-seo-tag

# Social preview card (Open Graph / Twitter) used for every page unless a page
# sets its own `image:` in front matter.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/og-card.jpg
social:
  name: Jackson Hull
  links:
    - https://github.com/Strawcabbage
    - https://www.linkedin.com/in/jackson-hull-132966278

permalink: /writing/:year/:title/

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
